name: PR1 SX1280 safe runtime build

on:
  push:
    paths:
      - 'firmware/t3s3_sx1280_runtime/**'
      - 'firmware/common/**'
      - 'tests/**'
      - '.github/workflows/pr1-runtime-safe-build.yml'
  pull_request:
    paths:
      - 'firmware/t3s3_sx1280_runtime/**'
      - 'firmware/common/**'
      - 'tests/**'
      - '.github/workflows/pr1-runtime-safe-build.yml'

jobs:
  safe-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++ host and sanitizer regression tests
        run: bash tests/run_host_tests.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18
      - name: Build RF-disabled runtime
        run: pio run --project-dir firmware/t3s3_sx1280_runtime -e safe
