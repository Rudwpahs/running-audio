; PR1 audio prototype lane (issue #52 lane D), step D2: RF-free audio-output bring-up.
; Same board/framework settings as firmware/t3s3_sx1280_runtime. The radio is never started.
[platformio]
default_envs = tone

[env]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
; literals next to code so inline PR1_AUDIO_IRAM functions link (same as the RF runtime)
build_src_flags =
    -mtext-section-literals

; D2-1: 440 Hz test tone -> I2S1 -> onboard MAX98357A (pins from the July/August code).
[env:tone]
build_flags =
    ${env.build_flags}
    -D PR1_AUDIO_MODE_TONE=1

; D2-2: stored IMA-ADPCM clip (data/clip.adpcm, made by tools/audio/pr1_adpcm.py) -> decode -> I2S.
[env:clip]
board_build.embed_files = data/clip.adpcm
build_flags =
    ${env.build_flags}
    -D PR1_AUDIO_MODE_CLIP=1