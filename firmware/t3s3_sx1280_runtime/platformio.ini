[platformio]
default_envs = safe

[env]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

[env:safe]
build_flags =
    ${env.build_flags}
    -D PR1_RF_ENABLED=0
    -D PR1_RUNTIME_ROLE=0

[env:rf_tx_compile]
build_flags =
    ${env.build_flags}
    -D PR1_RF_ENABLED=1
    -D PR1_RUNTIME_ROLE=1
lib_deps =
    jgromes/RadioLib @ 7.7.1

[env:rf_rx_compile]
build_flags =
    ${env.build_flags}
    -D PR1_RF_ENABLED=1
    -D PR1_RUNTIME_ROLE=2
lib_deps =
    jgromes/RadioLib @ 7.7.1
