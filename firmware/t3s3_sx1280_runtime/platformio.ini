[platformio]
default_envs = safe

[env]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
; Gate C1: literals next to code, so header (inline) functions can be placed in IRAM
; with PR1_IRAM (pr1_placement.hpp). Project sources only; framework/libraries unchanged.
build_src_flags =
    -mtext-section-literals

[env:safe]
build_flags =
    ${env.build_flags}
    -D PR1_RF_ENABLED=0
    -D PR1_RUNTIME_ROLE=0

[env:rf_tx_compile]
build_flags =
    ${env.build_flags}
    -D PR1_RF_ENABLED=1
    -D PR1_RUNTIME_ROLE=1
    -D PR1_TX_GAP_US=5000
lib_deps =
    jgromes/RadioLib @ 7.7.1

[env:rf_rx_compile]
build_flags =
    ${env.build_flags}
    -D PR1_RF_ENABLED=1
    -D PR1_RUNTIME_ROLE=2
lib_deps =
    jgromes/RadioLib @ 7.7.1

; D2-3: fixed-channel audio only. Estimator and AFH remain disabled.
[env:audio_tx]
extends = env:rf_tx_compile
board_build.embed_files = data/clip.adpcm
build_flags =
    ${env.build_flags}
    -D PR1_RF_ENABLED=1
    -D PR1_RUNTIME_ROLE=1
    -D PR1_TX_GAP_US=1000
    -D PR1_ENABLE_AFH=0
    -D PR1_AUDIO_RF=1

[env:audio_rx]
extends = env:rf_rx_compile
build_flags =
    ${env.build_flags}
    -D PR1_RF_ENABLED=1
    -D PR1_RUNTIME_ROLE=2
    -D PR1_TX_GAP_US=1000
    -D PR1_ENABLE_AFH=0
    -D PR1_AUDIO_RF=1

; Diagnostic arms for the RF-loss A/B (same as audio_rx / plain fixed-channel RX).
[env:audio_rx_noamp]
extends = env:audio_rx
build_flags =
    ${env:audio_rx.build_flags}
    -D PR1_AUDIO_AMP_OFF=1

[env:plain_rx]
extends = env:rf_rx_compile
build_flags =
    ${env.build_flags}
    -D PR1_RF_ENABLED=1
    -D PR1_RUNTIME_ROLE=2
    -D PR1_TX_GAP_US=1000
    -D PR1_ENABLE_AFH=0
